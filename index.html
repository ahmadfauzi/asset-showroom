<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Asset Showroom</title>
    <style>
      :root { --accent: #5fb3ff; }
      html, body { margin: 0; height: 100%; background: #16161a; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #no-webgl { display: none; color: #ddd; font: 16px system-ui, sans-serif; padding: 2rem; }
      #loader {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #16161a; color: #bbb; font: 14px system-ui, sans-serif;
        transition: opacity 0.4s;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #loader { transition: none; } }
      #tooltip {
        position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap;
        padding: 6px 10px; border-radius: 8px; border: 1px solid rgb(255 255 255 / 0.08);
        background: rgb(22 22 26 / 0.8); backdrop-filter: blur(8px);
        color: #eee; font: 13px/1.4 system-ui, sans-serif;
      }
      #tooltip .hint { color: #999; font-size: 12px; }
    </style>
  </head>
  <body>
    <p id="no-webgl">This page needs WebGL2, and your browser doesn't support it. Try the latest Chrome, Edge, Safari or Firefox.</p>
    <canvas id="scene"></canvas>
    <h1 id="title">Asset Showroom</h1>
    <aside id="slots" class="panel" aria-label="Surfaces">
      <div id="slot-list"></div>
      <section id="card" hidden>
        <img alt="" width="56" height="56" />
        <div>
          <div class="name"></div>
          <div class="meta"><span class="category"></span> · <span class="size"></span></div>
          <a target="_blank" rel="noopener noreferrer">View asset</a>
        </div>
      </section>
    </aside>
    <section id="daylight" class="panel" aria-label="Daylight">
      <div class="clock">12:00</div>
      <div class="presets"></div>
      <input type="range" min="6" max="22" step="0.25" aria-label="Time of day" />
    </section>
    <section id="tray" class="panel" aria-label="Textures">
      <div id="chip" class="panel"><span></span><button type="button" aria-label="Clear selection">×</button></div>
      <div id="tabs" role="tablist"></div>
      <div id="swatches"></div>
    </section>
    <div id="tooltip" hidden><div></div><div class="hint">Click to change</div></div>
    <div id="loader" role="status">Loading the room…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
